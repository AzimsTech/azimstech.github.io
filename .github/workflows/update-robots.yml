name: Update robots.txt

# When to run
on:
  schedule:
    - cron: '0 0 1 * *'  # First day of every month at midnight UTC
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download latest robots.txt
        run: |
          mkdir -p _site
          curl -o _site/robots.txt https://raw.githubusercontent.com/ai-robots-txt/ai.robots.txt/main/robots.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f _site/robots.txt
          if git diff --staged --quiet; then
            echo "No changes to _site/robots.txt"
          else
            git commit -m "Update _site/robots.txt from ai-robots-txt/ai.robots.txt"
            git push
          fi